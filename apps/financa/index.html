// detecta diff entre dois arrays de items {id, ...} pra propagar inserts/updates/deletes
function diffById(oldList, newList) {
  const oldMap = new Map(oldList.map(x => [x.id, x]))
  const newMap = new Map(newList.map(x => [x.id, x]))
  const added = newList.filter(x => !oldMap.has(x.id))
  const removed = oldList.filter(x => !newMap.has(x.id))
  const updated = newList.filter(x => {
    const o = oldMap.get(x.id)
    return o && JSON.stringify(o) !== JSON.stringify(x)
  })
  return { added, removed, updated }
}

async function geminiParseTransaction(apiKey, userText, categories) {
  if (!apiKey) throw new Error('Configure a chave do Gemini em Configurações.')
  const catalog = categories.map(c => `- ${c.name} (id=${c.id}, tipo=${c.type==='income'?'receita':'despesa'}, escopo=${c.scope})`).join('\n')
  const today = new Date().toISOString().slice(0,10)
  const prompt = `Você é um assistente financeiro. O usuário descreveu uma transação em português. Extraia os dados e responda APENAS em JSON.

Hoje é ${today}.

Categorias disponíveis (use o id que melhor corresponder):
${catalog}

Regras:
- "type": "income" para entrada/recebimento/venda, "expense" para gasto/pagamento
- "scope": "business" se for relacionado à empresa/venda/serviço prestado/clientes; "personal" caso contrário
- "amount": número positivo em reais (sem R$, sem separador). Ex: "mil e quinhentos" => 1500
- "description": frase curta resumindo a transação (máx 60 caracteres)
- "categoryId": id da categoria que mais combina (use exatamente um dos ids da lista)
- "date": data ISO YYYY-MM-DD. Se o usuário disser "hoje" ou nada, use ${today}. "ontem" = dia anterior, "amanhã" = dia seguinte. Para datas relativas como "dia 15" assuma o mês corrente.
- "dueDate": se for um pagamento futuro/agendado/programado para depois de hoje, use a data prevista. Caso contrário, null.
- "paid": true se já foi efetivado/pago/recebido; false se é só agendamento futuro.
- "confidence": 0 a 1 indicando quão confiante você está. Se ambíguo, < 0.6.

Texto do usuário: "${userText}"`

  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.2,
      responseMimeType: 'application/json',
      responseSchema: {
        type: 'object',
        properties: {
          type: { type:'string', enum:['income','expense'] },
          scope: { type:'string', enum:['personal','business'] },
          amount: { type:'number' },
          description: { type:'string' },
          categoryId: { type:'string' },
          date: { type:'string' },
          dueDate: { type:'string' },
          paid: { type:'boolean' },
          confidence: { type:'number' },
        },
        required: ['type','scope','amount','description','categoryId','date','paid','confidence']
      }
    }
  }
  const res = await fetch(`${GEMINI_URL}?key=${encodeURIComponent(apiKey)}`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  })
  if (!res.ok) {
    const err = await res.text().catch(()=>'')
    throw new Error(`Gemini ${res.status}: ${err.slice(0,200)}`)
  }
  const data = await res.json()
  const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text
  if (!txt) throw new Error('Resposta vazia da IA.')
  let parsed
  try { parsed = JSON.parse(txt) } catch { throw new Error('IA não retornou JSON válido.') }
  return parsed
}

// =====================================================================
// Web Speech API
// =====================================================================
function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null
}

function useSpeechRecognition() {
  const [supported] = useState(() => !!getSpeechRecognition())
  const [listening, setListening] = useState(false)
  const [transcript, setTranscript] = useState('')
  const [error, setError] = useState(null)
  const recRef = useRef(null)

  const start = useCallback(() => {
    const SR = getSpeechRecognition()
    if (!SR) { setError('Reconhecimento de voz não suportado neste navegador.'); return }
    setError(null); setTranscript('')
    const rec = new SR()
    rec.lang = 'pt-BR'
    rec.continuous = false
    rec.interimResults = true
    let finalTxt = ''
    rec.onresult = (ev) => {
      let interim = ''
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i]
        if (r.isFinal) finalTxt += r[0].transcript
        else interim += r[0].transcript
      }
      setTranscript((finalTxt + ' ' + interim).trim())
    }
    rec.onerror = (e) => { setError(e.error || 'Erro de microfone'); setListening(false) }
    rec.onend = () => setListening(false)
    recRef.current = rec
    try { rec.start(); setListening(true) } catch (e) { setError(String(e)); setListening(false) }
  }, [])

  const stop = useCallback(() => {
    try { recRef.current?.stop() } catch {}
    setListening(false)
  }, [])

  const reset = useCallback(() => { setTranscript(''); setError(null) }, [])

  return { supported, listening, transcript, error, start, stop, reset, setTranscript }
}

function AuthScreen() {
  const [mode, setMode] = useState('login') // 'login' | 'signup'
  const [name, setName] = useState('')
  const [email, setEmail] = useState('')
  const [password, setPassword] = useState('')
  const [showPwd, setShowPwd] = useState(false)
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const [info, setInfo] = useState(null)

  const submit = async () => {
    setError(null); setInfo(null)
    if (!email.trim()) return setError('Informe seu email.')
    if (password.length < 6) return setError('A senha precisa ter ao menos 6 caracteres.')
    if (mode === 'signup' && !name.trim()) return setError('Informe seu nome.')
    setBusy(true)
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password })
        if (error) throw error
      } else {
        const { data, error } = await sb.auth.signUp({
          email: email.trim(),
          password,
          options: { data: { name: name.trim() } },
        })
        if (error) throw error
        if (!data.session) {
          setInfo('Conta criada. Verifique seu email para confirmar e depois entre.')
          setMode('login')
        }
      }
    } catch (e) {
      setError(e.message || String(e))
    } finally {
      setBusy(false)
    }
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="w-20 h-20 rounded-3xl bg-emerald-500 mx-auto flex items-center justify-center text-4xl font-bold text-white mb-4 shadow-lg shadow-emerald-500/30">$</div>
          <h1 className="text-3xl font-bold">Finança</h1>
          <p className="text-neutral-400 mt-1">Controle financeiro do casal, sincronizado.</p>
        </div>

        <div className="flex bg-neutral-900 border border-neutral-800 rounded-xl p-1 mb-4">
          <button onClick={()=>{setMode('login');setError(null);setInfo(null)}} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode==='login'?'bg-emerald-500 text-black':'text-neutral-400'}`}>Entrar</button>
          <button onClick={()=>{setMode('signup');setError(null);setInfo(null)}} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode==='signup'?'bg-emerald-500 text-black':'text-neutral-400'}`}>Criar conta</button>
        </div>

                onChange={e=>setName(e.target.value)}
                placeholder="Como você quer ser chamado"
                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"
              />
            </Field>
          )}
          <Field label="Email">
            <input
              type="email"
              autoComplete="email"

              onChange={e=>setEmail(e.target.value)}
              placeholder="seu@email.com"
              className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"
            />
          </Field>
          <Field label="Senha">
            <div className="flex gap-2">
              <input
                type={showPwd?'text':'password'}
                autoComplete={mode==='login'?'current-password':'new-password'}

            </div>

          {info && <p className="text-xs text-emerald-400">{info}</p>}

            onClick={submit}

        </p>
      </div>
    </div>
  )
}

// =====================================================================
// HouseholdSetupScreen — escolher criar novo household ou entrar com código
// =====================================================================
function HouseholdSetupScreen({ session, onReady, onLogout }) {
  const defaultName = (session.user.user_metadata?.name || '').trim()
  const [mode, setMode] = useState('create') // 'create' | 'join'
  const [householdName, setHouseholdName] = useState(defaultName ? `Conta de ${defaultName.split(' ')[0]}` : 'Minha conta')
  const [inviteCode, setInviteCode] = useState('')
  const [displayName, setDisplayName] = useState(defaultName)
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)

  const submit = async () => {
    setError(null); setBusy(true)
    try {
      if (mode === 'create') {
        const { data, error } = await sb.rpc('create_household', {
          p_household_name: householdName.trim() || 'Minha conta',
          p_display_name: displayName.trim() || null,
        })
        if (error) throw error
        onReady(data)
      } else {
        const code = inviteCode.trim().toUpperCase()
        if (code.length < 4) throw new Error('Informe o código de convite.')
        const { data, error } = await sb.rpc('join_household_with_code', {
          p_invite_code: code,
          p_display_name: displayName.trim() || null,
        })
        if (error) throw error
        onReady(data)
      }
    } catch (e) {
      setError(e.message || String(e))
    } finally {
      setBusy(false)
    }
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-16 h-16 rounded-2xl bg-emerald-500 mx-auto flex items-center justify-center text-3xl font-bold text-white mb-3">$</div>
          <h1 className="text-2xl font-bold">Quase lá</h1>
          <p className="text-neutral-400 mt-1 text-sm">Crie uma conta familiar nova ou entre na de quem te convidou.</p>
        </div>

        <div className="flex bg-neutral-900 border border-neutral-800 rounded-xl p-1 mb-4">
          <button onClick={()=>{setMode('create');setError(null)}} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode==='create'?'bg-emerald-500 text-black':'text-neutral-400'}`}>Criar nova</button>
          <button onClick={()=>{setMode('join');setError(null)}} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode==='join'?'bg-emerald-500 text-black':'text-neutral-400'}`}>Tenho código</button>
        </div>

        <div className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800 space-y-3">
          <Field label="Como você quer ser chamado">
            <input
              value={displayName}
              onChange={e=>setDisplayName(e.target.value)}
              placeholder="Seu nome"
              className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"
            />
          </Field>

          {mode === 'create' && (
            <Field label="Nome da conta familiar">
              <input
                value={householdName}
                onChange={e=>setHouseholdName(e.target.value)}
                placeholder='ex: "Casa do Fabiano"'
                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"
              />
              <span className="text-xs text-neutral-500 mt-1 block">Você poderá convidar seu(sua) parceiro(a) depois — basta gerar um código no menu Configurações.</span>
            </Field>
          )}

          {mode === 'join' && (
            <Field label="Código de convite">
              <input
                value={inviteCode}
                onChange={e=>setInviteCode(e.target.value.toUpperCase())}
                placeholder="ex: ABCD2345"
                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500 tracking-widest font-mono uppercase"
                maxLength={12}
              />
              <span className="text-xs text-neutral-500 mt-1 block">Peça o código pra quem te convidou. Ele(a) gera em Configurações → Convidar.</span>
            </Field>
          )}

          {error && <p className="text-xs text-rose-400">{error}</p>}

          <button
            onClick={submit}
            disabled={busy}
            className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-black font-semibold py-3 rounded-xl flex items-center justify-center gap-2"
          >
            {busy && <span className="animate-spin w-4 h-4 border-2 border-black/40 border-t-black rounded-full"/>}
            {busy ? 'Aguarde...' : (mode==='create' ? 'Criar conta familiar' : 'Entrar com código')}
          </button>
        </div>

        <button onClick={onLogout} className="w-full mt-4 py-2.5 rounded-xl border border-neutral-800 text-neutral-400 text-sm">Sair</button>
      </div>
    </div>
  )
}

function Card({ children, className='' }) {
  return <div className={`bg-neutral-900 border border-neutral-800 rounded-2xl ${className}`}>{children}</div>
}

function ScopeChip({ scope, onClick }) {
  const isB = scope === 'business'
  return (
    <span onClick={onClick} className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wider ${isB ? 'bg-blue-500/15 text-blue-300' : 'bg-purple-500/15 text-purple-300'}`}>

function TypeBadge({ type }) {
  return type === 'income'
    ? <span className="text-emerald-400">{I.up}</span>

}

function Modal({ open, onClose, title, children, footer }) {
  if (!open) return null
  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/60 fade-in" onClick={onClose}>

      </div>
    </div>
  )
}

// =====================================================================
// Dashboard
// =====================================================================
function Dashboard({ transactions, categories, profile, onGoTo }) {
  const now = new Date()
  const curMK = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`

  const realized = useMemo(() => transactions.filter(t => t.paid !== false), [transactions])

  const monthTxs = useMemo(() => realized.filter(t => monthKey(t.date) === curMK), [realized, curMK])

  const incomeMonth = monthTxs.filter(t => t.type==='income').reduce((s,t)=>s+t.amount,0)
  const expenseMonth = monthTxs.filter(t => t.type==='expense').reduce((s,t)=>s+t.amount,0)
  const balanceMonth = incomeMonth - expenseMonth

  const personalExp = monthTxs.filter(t => t.type==='expense' && t.scope==='personal').reduce((s,t)=>s+t.amount,0)
  const businessExp = monthTxs.filter(t => t.type==='expense' && t.scope==='business').reduce((s,t)=>s+t.amount,0)

  // últimos 6 meses
  const last6 = useMemo(() => {
    const arr = []
    for (let i=5;i>=0;i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1)
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      const m = realized.filter(t => monthKey(t.date) === mk)
      arr.push({
        mes: d.toLocaleDateString('pt-BR',{ month:'short' }).replace('.',''),
        Receita: m.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),
        Despesa: m.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),
      })
    }
    return arr
  }, [realized])

  // breakdown por categoria (mês corrente, despesas)
  const expByCat = useMemo(() => {
    const map = new Map()
    monthTxs.filter(t=>t.type==='expense').forEach(t => {
      map.set(t.categoryId, (map.get(t.categoryId)||0) + t.amount)
    })
    return Array.from(map.entries())
      .map(([cid, val]) => {
        const c = categories.find(c => c.id === cid)
        return { name: c?.name || 'Outros', value: val, color: c?.color || '#64748b' }
      })
      .sort((a,b) => b.value - a.value)
  }, [monthTxs, categories])

  const topCats = expByCat.slice(0, 5)

  const recent = useMemo(() => [...transactions].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id)).slice(0, 5), [transactions])

  return (
    <div className="px-4 pt-4 pb-32 fade-in">
      <div className="flex items-center justify-between mb-1">
        <p className="text-neutral-400 text-sm">Olá, {profile.name.split(' ')[0]}</p>
        <p className="text-neutral-500 text-xs uppercase tracking-wider">{monthLabel(curMK)}</p>
      </div>

      {/* Saldo do mês */}
      <Card className="p-5 mt-3">
        <p className="text-xs uppercase tracking-wider text-neutral-500">Saldo do mês</p>
        <p className={`text-3xl font-bold mt-1 ${balanceMonth >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{fmtBRL(balanceMonth)}</p>
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
            <div className="flex items-center gap-1 text-emerald-400 text-xs uppercase tracking-wider">{I.up} Entradas</div>
            <p className="text-lg font-semibold mt-1">{fmtBRL(incomeMonth)}</p>
          </div>
          <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20">
            <div className="flex items-center gap-1 text-rose-400 text-xs uppercase tracking-wider">{I.down} Saídas</div>
            <p className="text-lg font-semibold mt-1">{fmtBRL(expenseMonth)}</p>
          </div>
        </div>
      </Card>

      {/* Pessoal vs Empresa */}
      <div className="grid grid-cols-2 gap-3 mt-3">
        <Card className="p-4">
          <p className="text-xs uppercase tracking-wider text-purple-300">Pessoal</p>
          <p className="text-xl font-semibold mt-1">{fmtBRL(personalExp)}</p>
          <p className="text-xs text-neutral-500 mt-1">gasto no mês</p>
        </Card>
        <Card className="p-4">
          <p className="text-xs uppercase tracking-wider text-blue-300">Empresa</p>
          <p className="text-xl font-semibold mt-1">{fmtBRL(businessExp)}</p>
          <p className="text-xs text-neutral-500 mt-1">gasto no mês</p>
        </Card>
      </div>

      {/* Gráfico de barras */}
      <Card className="p-4 mt-3">
        <p className="text-xs uppercase tracking-wider text-neutral-500 mb-2">Últimos 6 meses</p>
        <div className="h-44 -ml-2">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={last6}>
              <CartesianGrid stroke="#262626" strokeDasharray="3 3" vertical={false}/>
              <XAxis dataKey="mes" stroke="#737373" fontSize={11}/>
              <YAxis stroke="#737373" fontSize={11} tickFormatter={fmtBRLshort}/>
              <Tooltip formatter={fmtBRL} contentStyle={{ background:'#0a0a0a', border:'1px solid #262626', borderRadius:8 }}/>
              <Bar dataKey="Receita" fill="#10b981" radius={[6,6,0,0]} />
              <Bar dataKey="Despesa" fill="#f43f5e" radius={[6,6,0,0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </Card>

      {/* Top categorias */}
      {topCats.length > 0 && (
        <Card className="p-4 mt-3">
          <p className="text-xs uppercase tracking-wider text-neutral-500 mb-3">Top categorias do mês</p>
          <div className="grid grid-cols-1 gap-2">
            {topCats.map((c, i) => {
              const pct = expByCat.length ? Math.round((c.value / expByCat.reduce((s,x)=>s+x.value,0))*100) : 0
              return (
                <div key={i}>
                  <div className="flex items-center justify-between text-sm mb-1">
                    <span className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full" style={{background: c.color}}></span>
                      {c.name}
                    </span>
                    <span className="text-neutral-400">{fmtBRL(c.value)} <span className="text-neutral-600 text-xs">{pct}%</span></span>
                  </div>
                  <div className="h-1.5 rounded-full bg-neutral-800 overflow-hidden">
                    <div className="h-full rounded-full" style={{ background: c.color, width: pct+'%' }}/>
                  </div>
                </div>
              )
            })}
          </div>
        </Card>
      )}

      {/* Recentes */}
      <Card className="mt-3 overflow-hidden">
        <div className="flex items-center justify-between p-4 pb-2">
          <p className="text-xs uppercase tracking-wider text-neutral-500">Lançamentos recentes</p>
          <button onClick={() => onGoTo('list')} className="text-xs text-emerald-400">Ver todos</button>
        </div>
        {recent.length === 0 && <p className="px-4 pb-4 text-sm text-neutral-500">Nenhum lançamento ainda. Vá em "Registrar" para começar.</p>}
        <ul>
          {recent.map(t => {
            const cat = categories.find(c => c.id === t.categoryId)
            return (
              <li key={t.id} className="flex items-center gap-3 px-4 py-2.5 border-t border-neutral-800">
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-base" style={{ background: (cat?.color||'#64748b')+'33' }}>{cat?.emoji||'💱'}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5 truncate">
                    <span className="font-medium truncate">{t.description}</span>
                  </div>
                  <div className="flex items-center gap-2 text-[11px] text-neutral-500 mt-0.5">
                    <span>{cat?.name||'—'}</span>
                    <span>•</span>
                    <ScopeChip scope={t.scope}/>
                    <span>{fmtDate(t.date)}</span>
                  </div>
                </div>
                <div className={`text-right font-semibold ${t.type==='income'?'text-emerald-400':'text-rose-400'}`}>
                  {t.type==='income' ? '+' : '−'}{fmtBRL(t.amount)}
                </div>
              </li>
            )
          })}
        </ul>
      </Card>
    </div>
  )
}

// =====================================================================
// Tela: Registrar (texto, áudio, manual)
// =====================================================================
function RegistrarScreen({ profile, transactions, setTransactions, categories, settings, onDone, onGoTo }) {
  const hasKey = !!settings.geminiKey
  const [mode, setMode] = useState(hasKey ? 'ai' : 'manual') // 'ai' | 'manual'
  const [text, setText] = useState('')
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const [draft, setDraft] = useState(null) // proposta da IA antes de confirmar
  const speech = useSpeechRecognition()

  // sincroniza transcript do áudio com o textarea
  useEffect(() => { if (speech.transcript) setText(speech.transcript) }, [speech.transcript])

  const sendToAI = async (t) => {
    setError(null)
    if (!t.trim()) { setError('Escreva ou fale algo primeiro.'); return }
    if (!settings.geminiKey) { setError('Configure a chave do Gemini em Configurações.'); return }
    setBusy(true)
    try {
      const parsed = await geminiParseTransaction(settings.geminiKey, t.trim(), categories)
      setDraft({
        id: uid(),
        type: parsed.type,
        scope: parsed.scope,
        amount: Number(parsed.amount) || 0,
        description: parsed.description || t.trim().slice(0,60),
        categoryId: categories.find(c => c.id === parsed.categoryId)?.id || categories[0]?.id,
        date: parsed.date || todayISO(),
        dueDate: parsed.dueDate || null,
        paid: parsed.paid !== false,
        note: t.trim(),
        source: speech.transcript ? 'ai-audio' : 'ai-text',
        confidence: parsed.confidence,
        createdAt: Date.now(),
      })
    } catch (e) {
      setError(e.message || String(e))
    } finally {
      setBusy(false)
    }
  }

  const confirmDraft = () => {
    if (!draft) return
    setTransactions([draft, ...transactions])
    setDraft(null); setText(''); speech.reset()
    onDone?.()
  }

  return (
    <div className="px-4 pt-4 pb-32 fade-in">
      <div className="flex items-center gap-2 mb-3">
        <button onClick={() => setMode('manual')} className={`flex-1 py-2 rounded-xl text-sm font-medium ${mode==='manual' ? 'bg-emerald-500 text-black' : 'bg-neutral-900 text-neutral-400 border border-neutral-800'}`}>
          <span className="inline-flex items-center gap-1.5 justify-center">{I.edit} Manual</span>
        </button>
        <button onClick={() => setMode('ai')} className={`flex-1 py-2 rounded-xl text-sm font-medium ${mode==='ai' ? 'bg-emerald-500 text-black' : 'bg-neutral-900 text-neutral-400 border border-neutral-800'}`}>
          <span className="inline-flex items-center gap-1.5 justify-center">{I.spark} Com IA {!hasKey && <span className="text-[9px] uppercase tracking-wider opacity-60">opcional</span>}</span>
        </button>
      </div>

      {mode === 'manual' && (
        <ManualForm
          categories={categories}
          onSave={(t) => { setTransactions([t, ...transactions]); onDone?.() }}
        />
      )}

      {mode === 'ai' && !hasKey && (
        <Card className="p-6 text-center">
          <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center mb-3">{I.spark}</div>
          <h3 className="font-semibold text-lg">Registrar conversando com IA</h3>
          <p className="text-sm text-neutral-400 mt-2 leading-relaxed">Em vez de preencher campos, você fala ou digita o que aconteceu — ex.: <span className="text-neutral-200">"vendi um serviço de 1500 pro João"</span> — e a IA preenche tudo. É opcional, dá pra usar o app inteiro só no manual.</p>
          <button onClick={() => onGoTo?.('settings')} className="mt-4 bg-emerald-500 hover:bg-emerald-400 text-black font-semibold py-2.5 px-5 rounded-xl">Ativar IA (opcional)</button>
          <p className="text-xs text-neutral-600 mt-3">É grátis em ai.google.dev</p>
        </Card>
      )}

      {mode === 'ai' && hasKey && (
        <Card className="p-4">
          <p className="text-xs uppercase tracking-wider text-neutral-500 mb-2">Conte o que aconteceu</p>
          <textarea
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder='ex.: "Vendi um serviço de R$ 1.500 pro cliente João hoje" ou "Gastei 80 reais no mercado ontem"'
            className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-3 min-h-[110px] outline-none focus:border-emerald-500 text-sm leading-relaxed"
          />

          <div className="flex items-center gap-3 mt-3">
            {speech.supported ? (
              <button
                onClick={() => speech.listening ? speech.stop() : speech.start()}
                className={`w-14 h-14 rounded-full flex items-center justify-center text-white ${speech.listening ? 'bg-red-500 rec-pulse' : 'bg-neutral-800'}`}
                aria-label="Gravar áudio"
              >
                {I.mic}
              </button>
            ) : (
              <div className="text-xs text-neutral-500 flex-1">Áudio não suportado neste navegador.</div>
            )}
            <button
              disabled={busy || !text.trim()}
              onClick={() => sendToAI(text)}
              className="flex-1 bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-black font-semibold py-3 rounded-xl flex items-center justify-center gap-2"
            >
              {busy ? <span className="animate-spin w-4 h-4 border-2 border-black/40 border-t-black rounded-full"/> : I.send}
              {busy ? 'Interpretando...' : 'Interpretar com IA'}
            </button>
          </div>

          {speech.listening && <p className="text-xs text-red-400 mt-2 animate-pulse">Gravando... toque no microfone para parar</p>}
          {speech.error && <p className="text-xs text-amber-400 mt-2">{speech.error}</p>}
          {error && <p className="text-xs text-rose-400 mt-2">{error}</p>}
        </Card>
      )}

      {/* Modal de confirmação do draft da IA */}
      {draft && (
        <Modal
          open
          onClose={() => setDraft(null)}
          title="Confirmar lançamento"
          footer={<>
            <button onClick={() => setDraft(null)} className="flex-1 py-2.5 rounded-xl bg-neutral-800 text-neutral-300">Cancelar</button>
            <button onClick={confirmDraft} className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-black font-semibold">Salvar</button>
          </>}
        >
          <DraftEditor draft={draft} onChange={setDraft} categories={categories}/>
          {draft.confidence != null && draft.confidence < 0.7 && (
            <p className="text-xs text-amber-400 mt-3">A IA ficou com confiança baixa ({Math.round(draft.confidence*100)}%). Confira os dados acima.</p>
          )}
        </Modal>
      )}
    </div>
  )
}

function DraftEditor({ draft, onChange, categories }) {
  const u = (patch) => onChange({ ...draft, ...patch })
  const cat = categories.find(c => c.id === draft.categoryId)
  const compatibleCats = categories.filter(c => c.type === draft.type)
  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <button onClick={() => u({ type:'expense' })} className={`flex-1 py-2 rounded-xl text-sm font-medium ${draft.type==='expense'?'bg-rose-500/20 text-rose-300 border border-rose-500/40':'bg-neutral-800 text-neutral-400'}`}>Saída</button>
        <button onClick={() => u({ type:'income'  })} className={`flex-1 py-2 rounded-xl text-sm font-medium ${draft.type==='income' ?'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40':'bg-neutral-800 text-neutral-400'}`}>Entrada</button>
      </div>
      <div className="flex gap-2">
        <button onClick={() => u({ scope:'personal' })} className={`flex-1 py-2 rounded-xl text-sm font-medium ${draft.scope==='personal'?'bg-purple-500/20 text-purple-300 border border-purple-500/40':'bg-neutral-800 text-neutral-400'}`}>Pessoal</button>
        <button onClick={() => u({ scope:'business' })} className={`flex-1 py-2 rounded-xl text-sm font-medium ${draft.scope==='business'?'bg-blue-500/20 text-blue-300 border border-blue-500/40':'bg-neutral-800 text-neutral-400'}`}>Empresa</button>
      </div>
      <Field label="Descrição">
        <input value={draft.description} onChange={e=>u({description:e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"/>
      </Field>
      <Field label="Valor (R$)">
        <input type="number" inputMode="decimal" step="0.01" value={draft.amount} onChange={e=>u({amount:Number(e.target.value)||0})} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500 text-lg font-semibold"/>
      </Field>
      <Field label="Categoria">
        <select value={draft.categoryId} onChange={e=>u({categoryId:e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500">
          {compatibleCats.map(c => <option key={c.id} value={c.id}>{c.emoji} {c.name}</option>)}
        </select>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Data">

function ManualForm({ categories, onSave, initial, submitLabel='Salvar lançamento' }) {
  const [t, setT] = useState(() => initial || ({
    id: uid(),
    type: 'expense',
    scope: 'personal',
    amount: 0,
    description: '',
    categoryId: categories.find(c => c.type==='expense' && c.scope==='personal')?.id || categories[0]?.id,
    date: todayISO(),
    dueDate: null,
    paid: true,
    source: 'manual',
    createdAt: Date.now(),
  }))
  const u = (patch) => setT(p => ({ ...p, ...patch }))
  const compatible = categories.filter(c => c.type === t.type)
  // garantir categoria compatível
  useEffect(() => {
    if (!compatible.find(c => c.id === t.categoryId)) {
      u({ categoryId: compatible[0]?.id })
    }
  }, [t.type])

  const save = () => {
    if (!t.amount || t.amount <= 0) return alert('Informe um valor maior que zero.')
    if (!t.description.trim()) return alert('Informe uma descrição.')
    onSave({ ...t, description: t.description.trim() })
  }

  return (
    <Card className="p-4">
      <DraftEditor draft={t} onChange={setT} categories={categories}/>
      <button onClick={save} className="w-full mt-4 bg-emerald-500 hover:bg-emerald-400 text-black font-semibold py-3 rounded-xl">{submitLabel}</button>
    </Card>
  )
}

// Tela: Lista de transações
// =====================================================================
function ListaScreen({ transactions, setTransactions, categories }) {
  const [filterType, setFilterType] = useState('all') // all|income|expense
  const [filterScope, setFilterScope] = useState('all') // all|personal|business
  const [search, setSearch] = useState('')
  const [editing, setEditing] = useState(null)

  const filtered = useMemo(() => {
    return transactions.filter(t => {
      if (filterType !== 'all' && t.type !== filterType) return false
      if (filterScope !== 'all' && t.scope !== filterScope) return false
      if (search.trim()) {
        const s = search.toLowerCase()
        const cat = categories.find(c => c.id === t.categoryId)?.name.toLowerCase() || ''
        if (!t.description.toLowerCase().includes(s) && !cat.includes(s)) return false
      }
      return true
    }).sort((a,b) => (b.date+b.createdAt).localeCompare(a.date+a.createdAt))
  }, [transactions, filterType, filterScope, search, categories])

  // agrupa por dia
  const grouped = useMemo(() => {
    const map = new Map()
    filtered.forEach(t => {
      const k = t.date
      if (!map.has(k)) map.set(k, [])
      map.get(k).push(t)
    })
    return Array.from(map.entries())
  }, [filtered])

  const remove = (id) => {
    if (!confirm('Remover este lançamento?')) return
    setTransactions(transactions.filter(t => t.id !== id))
  }

  return (
    <div className="px-4 pt-4 pb-32 fade-in">
      <div className="flex items-center gap-2 bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 mb-3">
        <span className="text-neutral-500">{I.search}</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..." className="flex-1 bg-transparent outline-none text-sm"/>
      </div>
      <div className="flex items-center gap-2 mb-3 overflow-x-auto no-scrollbar">
        {[['all','Tudo'],['income','Entradas'],['expense','Saídas']].map(([k,l])=>(
          <button key={k} onClick={()=>setFilterType(k)} className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap ${filterType===k?'bg-emerald-500 text-black':'bg-neutral-900 border border-neutral-800 text-neutral-400'}`}>{l}</button>
        ))}
        <span className="text-neutral-700">|</span>
        {[['all','Todos'],['personal','Pessoal'],['business','Empresa']].map(([k,l])=>(
          <button key={k} onClick={()=>setFilterScope(k)} className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap ${filterScope===k?'bg-emerald-500 text-black':'bg-neutral-900 border border-neutral-800 text-neutral-400'}`}>{l}</button>
        ))}
      </div>

      {grouped.length === 0 && (
        <div className="text-center text-neutral-500 mt-12 text-sm">Nenhum lançamento encontrado.</div>
      )}

      {grouped.map(([day, items]) => {
        const dayIn = items.filter(t=>t.type==='income' && t.paid!==false).reduce((s,t)=>s+t.amount,0)
        const dayOut = items.filter(t=>t.type==='expense' && t.paid!==false).reduce((s,t)=>s+t.amount,0)
        return (
          <div key={day} className="mb-4">
            <div className="flex items-center justify-between text-xs text-neutral-500 mb-2 px-1">
              <span className="uppercase tracking-wider">{fmtDateLong(day)}</span>
              <span>
                {dayIn > 0 && <span className="text-emerald-400">+{fmtBRL(dayIn)} </span>}
                {dayOut > 0 && <span className="text-rose-400">−{fmtBRL(dayOut)}</span>}
              </span>
            </div>
            <Card className="overflow-hidden">
              <ul>
                {items.map((t,i) => {
                  const cat = categories.find(c => c.id === t.categoryId)
                  return (
                    <li key={t.id} className={`flex items-center gap-3 p-3 ${i>0 ? 'border-t border-neutral-800' : ''}`} onClick={() => setEditing(t)}>
                      <div className="w-10 h-10 rounded-full flex items-center justify-center text-base shrink-0" style={{ background: (cat?.color||'#64748b')+'33' }}>{cat?.emoji||'💱'}</div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-1.5">
                          <span className="font-medium truncate">{t.description}</span>
                          {t.paid === false && <span className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 bg-amber-500/20 text-amber-300 rounded">Pend.</span>}
                        </div>
                        <div className="flex items-center gap-2 text-[11px] text-neutral-500 mt-0.5">
                          <span>{cat?.name||'—'}</span>
                          <ScopeChip scope={t.scope}/>
                          {t.dueDate && <span className="text-amber-400">vence {fmtDate(t.dueDate)}</span>}
                        </div>
                      </div>
                      <div className="text-right">
                        <div className={`font-semibold ${t.type==='income'?'text-emerald-400':'text-rose-400'}`}>
                          {t.type==='income' ? '+' : '−'}{fmtBRL(t.amount)}
                        </div>
                      </div>
                    </li>
                  )
                })}
              </ul>
            </Card>
          </div>
        )
      })}

      {editing && (
        <Modal open onClose={()=>setEditing(null)} title="Editar lançamento"
          footer={<>
            <button onClick={() => { remove(editing.id); setEditing(null) }} className="px-3 py-2.5 rounded-xl bg-rose-500/15 text-rose-300 border border-rose-500/30">{I.trash}</button>
            <button onClick={() => setEditing(null)} className="flex-1 py-2.5 rounded-xl bg-neutral-800 text-neutral-300">Cancelar</button>
            <button onClick={() => {
              setTransactions(transactions.map(t => t.id === editing.id ? editing : t))
              setEditing(null)
            }} className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-black font-semibold">Salvar</button>
          </>}>
          <DraftEditor draft={editing} onChange={setEditing} categories={categories}/>
        </Modal>
      )}
    </div>
  )
}

// Tela: Planejamento (futuras + DRE projetado)
// =====================================================================
function PlanejamentoScreen({ transactions, setTransactions, categories }) {
  const today = todayISO()
  const future = useMemo(() => transactions.filter(t => (t.dueDate && t.dueDate >= today) || (t.paid === false)).sort((a,b) => (a.dueDate||a.date).localeCompare(b.dueDate||b.date)), [transactions, today])

  // DRE próximos 6 meses (projetado)
  const projection = useMemo(() => {
    const arr = []
    const now = new Date()
    for (let i=0;i<6;i++) {
      const d = new Date(now.getFullYear(), now.getMonth()+i, 1)
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      const month = transactions.filter(t => monthKey(t.dueDate || t.date) === mk)
      const realized = transactions.filter(t => monthKey(t.date) === mk && t.paid !== false)
      arr.push({
        mes: d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''),
        realizado: realized.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0) - realized.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),
        projetado: month.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0) - month.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),
      })
    }
    return arr
  }, [transactions])

  const markPaid = (id, paid) => {
    setTransactions(transactions.map(t => t.id === id ? { ...t, paid } : t))
  }

  const [adding, setAdding] = useState(false)

  return (
    <div className="px-4 pt-4 pb-32 fade-in">
      <Card className="p-4">
        <p className="text-xs uppercase tracking-wider text-neutral-500 mb-2">DRE projetado · 6 meses</p>
        <div className="h-44 -ml-2">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={projection}>
              <CartesianGrid stroke="#262626" strokeDasharray="3 3" vertical={false}/>
              <XAxis dataKey="mes" stroke="#737373" fontSize={11}/>
              <YAxis stroke="#737373" fontSize={11} tickFormatter={fmtBRLshort}/>
              <Tooltip formatter={fmtBRL} contentStyle={{ background:'#0a0a0a', border:'1px solid #262626', borderRadius:8 }}/>
              <Line dataKey="realizado" name="Realizado" stroke="#10b981" strokeWidth={2} dot={false}/>
              <Line dataKey="projetado" name="Projetado" stroke="#f59e0b" strokeWidth={2} strokeDasharray="4 4" dot={false}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div className="flex items-center gap-4 text-xs text-neutral-400 mt-2">
          <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-emerald-500"/> Realizado</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-amber-500"/> Projetado</span>
        </div>
      </Card>

      <div className="flex items-center justify-between mt-5 mb-2 px-1">
        <p className="text-xs uppercase tracking-wider text-neutral-500">Próximos & pendentes</p>
        <button onClick={()=>setAdding(true)} className="text-xs text-emerald-400 inline-flex items-center gap-1">{I.plus} Agendar</button>
      </div>

      {future.length === 0 && <div className="text-center text-neutral-500 mt-6 text-sm">Nada agendado pra frente. Agende contas como IPVA, anuidade, etc.</div>}

      <div className="space-y-2">
        {future.map(t => {
          const cat = categories.find(c => c.id === t.categoryId)
          const dueDate = t.dueDate || t.date
          const overdue = dueDate < today && t.paid === false
          return (
            <Card key={t.id} className={`p-3 flex items-center gap-3 ${overdue ? 'border-rose-500/40' : ''}`}>
              <div className="w-10 h-10 rounded-full flex items-center justify-center text-base shrink-0" style={{ background: (cat?.color||'#64748b')+'33' }}>{cat?.emoji||'📅'}</div>
              <div className="flex-1 min-w-0">
                <div className="font-medium truncate">{t.description}</div>
                <div className="flex items-center gap-2 text-[11px] text-neutral-500 mt-0.5">
                  <span className={overdue?'text-rose-400':''}>vence {fmtDate(dueDate)}</span>
                  <ScopeChip scope={t.scope}/>
                </div>
              </div>
              <div className="text-right">
                <div className={`font-semibold ${t.type==='income'?'text-emerald-400':'text-rose-400'}`}>
                  {t.type==='income' ? '+' : '−'}{fmtBRL(t.amount)}
                </div>
                <button onClick={() => markPaid(t.id, true)} className="mt-1 text-[10px] uppercase tracking-wider text-emerald-400">marcar pago</button>
              </div>
            </Card>
          )
        })}
      </div>

      {adding && (
        <Modal open onClose={()=>setAdding(false)} title="Agendar lançamento futuro">
          <ManualForm
            categories={categories}
            initial={{
              id: uid(), type:'expense', scope:'personal', amount:0, description:'',
              categoryId: categories.find(c=>c.type==='expense'&&c.scope==='personal')?.id || categories[0]?.id,
              date: todayISO(), dueDate: todayISO(), paid: false, source:'manual', createdAt: Date.now(),
            }}
            onSave={(t) => { setTransactions(prev => [t, ...prev]); setAdding(false) }}
            submitLabel="Agendar"
          />
        </Modal>
      )}
    </div>
  )
}

function ConfigScreen({ profile, setProfile, settings, setSettings, household, onRegenerateInvite, transactions, categories, onLogout }) {
  const [keyDraft, setKeyDraft] = useState(settings.geminiKey || '')
  const [showKey, setShowKey] = useState(false)
  const [savedKey, setSavedKey] = useState(false)
  const [savedName, setSavedName] = useState(false)
  const [nameDraft, setNameDraft] = useState(profile.name || '')
  const [copied, setCopied] = useState(false)
  const [regenerating, setRegenerating] = useState(false)

  useEffect(() => { setKeyDraft(settings.geminiKey || '') }, [settings.geminiKey])
  useEffect(() => { setNameDraft(profile.name || '') }, [profile.name])

  const saveKey = async () => {
    await setSettings({ ...settings, geminiKey: keyDraft.trim() })
    setSavedKey(true)
    setTimeout(() => setSavedKey(false), 2000)
  }

  const saveName = async () => {
    if (!nameDraft.trim()) return
    await setProfile({ ...profile, name: nameDraft.trim() })
    setSavedName(true)
    setTimeout(() => setSavedName(false), 2000)
  }

  const copyCode = async () => {
    if (!household?.invite_code) return
    try {
      await navigator.clipboard.writeText(household.invite_code)
      setCopied(true)
      setTimeout(() => setCopied(false), 1500)
    } catch {
      alert('Código: ' + household.invite_code)
    }
  }

  const shareCode = async () => {
    if (!household?.invite_code) return
    const text = `Te convidei pra acompanhar nossas finanças no Finança. Crie sua conta e use este código de convite: ${household.invite_code}\n\nAcesse: ${location.origin}${location.pathname}`
    if (navigator.share) {
      try { await navigator.share({ title: 'Convite Finança', text }) } catch {}
    } else {
      copyCode()
    }
  }

  const regenerate = async () => {
    if (!confirm('Gerar um novo código de convite? O código anterior deixa de funcionar imediatamente.')) return
    setRegenerating(true)
    try { await onRegenerateInvite() }
    finally { setRegenerating(false) }
  }

  return (
    <div className="px-4 pt-4 pb-32 fade-in space-y-4">
      <Card className="p-4">
        <p className="text-xs uppercase tracking-wider text-neutral-500 mb-2">Seu nome</p>
        <div className="flex gap-2">
          <input value={nameDraft} onChange={e=>setNameDraft(e.target.value)} className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500"/>
          <button onClick={saveName} className="px-4 rounded-xl bg-emerald-500 text-black font-semibold text-sm">{savedName?'✓':'Salvar'}</button>
        </div>
        <p className="text-[11px] text-neutral-600 mt-2">Logado como <span className="text-neutral-400">{profile.email}</span></p>
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-2">
          <p className="text-xs uppercase tracking-wider text-neutral-500">Convidar parceiro(a)</p>
          <span className="text-[10px] uppercase tracking-wider text-emerald-400">{household?.name}</span>
        </div>
        <p className="text-xs text-neutral-500 mb-3">Compartilhe este código com seu(sua) parceiro(a). Ele(a) cria uma conta própria e digita o código pra entrar nesta mesma conta familiar — vocês passam a ver e atualizar tudo juntos.</p>
        <div className="bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-4 flex items-center justify-between gap-3">
          <span className="font-mono text-2xl tracking-[0.3em] text-emerald-400 font-bold">{household?.invite_code || '—'}</span>
          <div className="flex gap-1">
            <button onClick={copyCode} className="px-3 py-2 rounded-lg bg-neutral-800 text-neutral-300 text-xs">{copied?'✓ copiado':'copiar'}</button>
          </div>
        </div>
        <div className="flex gap-2 mt-3">
          <button onClick={shareCode} className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-semibold text-sm">Compartilhar convite</button>
          <button onClick={regenerate} disabled={regenerating} className="px-3 py-2.5 rounded-xl bg-neutral-800 text-neutral-300 text-xs disabled:opacity-50">{regenerating?'...':'Gerar novo'}</button>
        </div>
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-2">
          <p className="text-xs uppercase tracking-wider text-neutral-500">Chave da IA (Gemini)</p>
          <span className="text-[10px] uppercase tracking-wider text-neutral-600">opcional · compartilhada</span>
        </div>
        <p className="text-xs text-neutral-500 mb-2">A IA interpreta texto/áudio e preenche os campos automaticamente. O app funciona 100% sem ela. Pegue grátis em <span className="text-emerald-400">ai.google.dev</span> → "Get API key". A chave fica salva na conta familiar — todos do casal usam a mesma.</p>
        <div className="flex gap-2">
          <input
            type={showKey?'text':'password'}
            value={keyDraft}
            onChange={e=>setKeyDraft(e.target.value)}
            placeholder="AIza..."
            className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500 text-sm"
          />
          <button onClick={()=>setShowKey(s=>!s)} className="px-3 rounded-xl bg-neutral-800 text-neutral-400 text-xs">{showKey?'ocultar':'mostrar'}</button>
        </div>
        <button onClick={saveKey} className="w-full mt-2 bg-emerald-500 hover:bg-emerald-400 text-black font-semibold py-2.5 rounded-xl">{savedKey?'✓ salvo':'Salvar chave'}</button>
      </Card>

      <Card className="p-4">
        <p className="text-xs uppercase tracking-wider text-neutral-500 mb-2">Sobre</p>
        <p className="text-sm text-neutral-400">Finança · sincronizado na nuvem</p>
        <p className="text-xs text-neutral-600 mt-1">{transactions.length} lançamentos · {categories.length} categorias</p>
      </Card>

      <button onClick={onLogout} className="w-full py-3 rounded-xl border border-neutral-800 text-neutral-400">Sair</button>
    </div>
  )
}

// =====================================================================
// App principal — carrega/sincroniza dados via Supabase
// =====================================================================
function MainApp({ session, householdId, onLogout }) {
  const userId = session.user.id
  const [transactions, setTransactionsLocal] = useState([])
  const [categories, setCategoriesLocal]     = useState([])
  const [household, setHousehold]            = useState(null)
  const [member, setMember]                  = useState(null)
  const [loading, setLoading]                = useState(true)
  const [tab, setTab]                        = useState('home')

  // Carrega tudo do household
  useEffect(() => {
    let cancelled = false
    setLoading(true)
    Promise.all([
      sb.from('transactions').select('*').eq('household_id', householdId),
      sb.from('categories').select('*').eq('household_id', householdId),
      sb.from('households').select('*').eq('id', householdId).single(),
      sb.from('household_members').select('*').eq('household_id', householdId).eq('user_id', userId).maybeSingle(),
    ]).then(([txRes, catRes, hhRes, memRes]) => {
      if (cancelled) return
      setTransactionsLocal((txRes.data || []).map(rowToTx))
      setCategoriesLocal((catRes.data || []).map(rowToCat))
      setHousehold(hhRes.data)
      setMember(memRes.data)
      setLoading(false)
    }).catch(e => {
      if (!cancelled) { console.error(e); setLoading(false) }
    })
    return () => { cancelled = true }
  }, [householdId, userId])

  // Realtime — sincroniza mudanças entre dispositivos
  useEffect(() => {
    if (!householdId) return
    const ch = sb.channel(`hh:${householdId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions', filter: `household_id=eq.${householdId}` }, p => {
        if (p.eventType === 'INSERT') {
          setTransactionsLocal(prev => prev.find(t => t.id === p.new.id) ? prev : [rowToTx(p.new), ...prev])
        } else if (p.eventType === 'UPDATE') {
          setTransactionsLocal(prev => prev.map(t => t.id === p.new.id ? rowToTx(p.new) : t))
        } else if (p.eventType === 'DELETE') {
          setTransactionsLocal(prev => prev.filter(t => t.id !== p.old.id))
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'categories', filter: `household_id=eq.${householdId}` }, p => {
        if (p.eventType === 'INSERT') {
          setCategoriesLocal(prev => prev.find(c => c.id === p.new.id) ? prev : [...prev, rowToCat(p.new)])
        } else if (p.eventType === 'UPDATE') {
          setCategoriesLocal(prev => prev.map(c => c.id === p.new.id ? rowToCat(p.new) : c))
        } else if (p.eventType === 'DELETE') {
          setCategoriesLocal(prev => prev.filter(c => c.id !== p.old.id))
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: `id=eq.${householdId}` }, p => {
        setHousehold(p.new)
      })
      .subscribe()
    return () => { sb.removeChannel(ch) }
  }, [householdId])

  // Setters compatíveis com a API antiga (set state com next array ou função)
  const setTransactions = useCallback((next) => {
    setTransactionsLocal(prev => {
      const newList = typeof next === 'function' ? next(prev) : next
      const { added, removed, updated } = diffById(prev, newList)
      added.forEach(async t => {
        const { error } = await sb.from('transactions').insert(txToRow(t, householdId, userId))
        if (error) console.error('insert tx', error)
      })
      removed.forEach(async t => {
        const { error } = await sb.from('transactions').delete().eq('id', t.id)
        if (error) console.error('delete tx', error)
      })
      updated.forEach(async t => {
        const row = txToRow(t, householdId, t.userId || userId)
        delete row.household_id
        delete row.id
        const { error } = await sb.from('transactions').update(row).eq('id', t.id)
        if (error) console.error('update tx', error)
      })
      return newList
    })
  }, [householdId, userId])

  const setCategories = useCallback((next) => {
    setCategoriesLocal(prev => {
      const newList = typeof next === 'function' ? next(prev) : next
      const { added, removed, updated } = diffById(prev, newList)
      added.forEach(async c => {
        const { error } = await sb.from('categories').insert(catToRow(c, householdId))
        if (error) console.error('insert cat', error)
      })
      removed.forEach(async c => {
        const { error } = await sb.from('categories').delete().eq('id', c.id)
        if (error) console.error('delete cat', error)
      })
      updated.forEach(async c => {
        const row = catToRow(c, householdId)
        delete row.household_id
        delete row.id
        const { error } = await sb.from('categories').update(row).eq('id', c.id)
        if (error) console.error('update cat', error)
      })
      return newList
    })
  }, [householdId])

  // settings derivado de household.gemini_api_key
  const settings = useMemo(() => ({ geminiKey: household?.gemini_api_key || '' }), [household])
  const setSettings = useCallback(async (next) => {
    const newVal = typeof next === 'function' ? next(settings) : next
    const key = (newVal.geminiKey || '').trim() || null
    setHousehold(prev => prev ? { ...prev, gemini_api_key: key } : prev)
    const { error } = await sb.from('households').update({ gemini_api_key: key }).eq('id', householdId)
    if (error) console.error('update household key', error)
  }, [householdId, settings])

  // profile derivado de session + member
  const profile = useMemo(() => ({
    id: userId,
    name: member?.display_name || session.user.user_metadata?.name || (session.user.email?.split('@')[0]) || 'Você',
    email: session.user.email,
  }), [member, session, userId])
  const setProfile = useCallback(async (next) => {
    const newP = typeof next === 'function' ? next(profile) : next
    setMember(prev => prev ? { ...prev, display_name: newP.name } : prev)
    const { error } = await sb.from('household_members')
      .update({ display_name: newP.name })
      .eq('household_id', householdId).eq('user_id', userId)
    if (error) console.error('update member name', error)
  }, [profile, householdId, userId])

  const handleRegenerateInvite = useCallback(async () => {
    const { data, error } = await sb.rpc('regenerate_invite_code', { p_household_id: householdId })
    if (error) { alert(error.message); return }
    setHousehold(prev => prev ? { ...prev, invite_code: data } : prev)
  }, [householdId])

  if (loading) return <SplashLoader label="Sincronizando..."/>

  return (
    <div className="min-h-screen pb-20 safe-top">
      <header className="sticky top-0 z-30 bg-neutral-950/80 backdrop-blur border-b border-neutral-900 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center text-white font-bold">$</div>
          <div>
            <div className="font-semibold leading-none">Finança</div>
            <div className="text-[10px] text-neutral-500 uppercase tracking-wider">{tabLabels[tab]||''}</div>
          </div>
        </div>
        {tab !== 'categories' && tab !== 'settings' && (
          <button onClick={()=>setTab('categories')} className="text-neutral-400 text-xs">Categorias</button>
        )}
      </header>

      {tab === 'home'       && <Dashboard transactions={transactions} categories={categories} profile={profile} onGoTo={setTab}/>}
      {tab === 'register'   && <RegistrarScreen profile={profile} transactions={transactions} setTransactions={setTransactions} categories={categories} settings={settings} onDone={() => setTab('list')} onGoTo={setTab}/>}
      {tab === 'list'       && <ListaScreen transactions={transactions} setTransactions={setTransactions} categories={categories}/>}
      {tab === 'plan'       && <PlanejamentoScreen transactions={transactions} setTransactions={setTransactions} categories={categories}/>}
      {tab === 'categories' && <CategoriasScreen categories={categories} setCategories={setCategories}/>}
      {tab === 'settings'   && <ConfigScreen profile={profile} setProfile={setProfile} settings={settings} setSettings={setSettings} household={household} onRegenerateInvite={handleRegenerateInvite} transactions={transactions} categories={categories} onLogout={onLogout}/>}

      <BottomNav tab={tab} setTab={setTab}/>
    </div>
  )
}

const tabLabels = {
  home:'Dashboard', register:'Registrar', list:'Lançamentos', plan:'Planejamento',
  categories:'Categorias', settings:'Configurações'
}

function BottomNav({ tab, setTab }) {
  const items = [
    { id:'home',     label:'Início',  icon: I.home },
    { id:'list',     label:'Lista',   icon: I.list },
    { id:'register', label:'',        icon: I.plus, primary:true },
    { id:'plan',     label:'Planejar',icon: I.cal },
    { id:'settings', label:'Config',  icon: I.cog },
  ]
  return (
    <nav className="fixed bottom-0 left-0 right-0 bg-neutral-950/95 backdrop-blur border-t border-neutral-900 safe-bottom z-30">
      <div className="flex items-stretch justify-around max-w-xl mx-auto">
        {items.map(it => it.primary ? (
          <button key={it.id} onClick={()=>setTab(it.id)} className="flex-1 flex justify-center -mt-5">
            <div className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg ${tab===it.id?'bg-emerald-400':'bg-emerald-500'} shadow-emerald-500/40`}>
              {it.icon}
            </div>
          </button>
        ) : (
          <button key={it.id} onClick={()=>setTab(it.id)} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 ${tab===it.id?'text-emerald-400':'text-neutral-500'}`}>
            {it.icon}
            <span className="text-[10px]">{it.label}</span>
          </button>
        ))}
      </div>
    </nav>
  )
}

// =====================================================================
// Root — gerencia sessão Supabase + escolha do household
// =====================================================================
function App() {
  const [session, setSession] = useState(null)
  const [loadingSession, setLoadingSession] = useState(true)
  const [householdId, setHouseholdId] = useState(null)
  const [householdLoading, setHouseholdLoading] = useState(false)

  // Boot: pega sessão atual + listener
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session)
      setLoadingSession(false)
    })
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess)
      if (!sess) setHouseholdId(null)
    })
    return () => sub.subscription.unsubscribe()
  }, [])

  // Quando há sessão, busca household do user
  useEffect(() => {
    if (!session) return
    setHouseholdLoading(true)
    sb.from('household_members')
      .select('household_id')
      .eq('user_id', session.user.id)
      .order('joined_at', { ascending: true })
      .limit(1)
      .maybeSingle()
      .then(({ data }) => {
        setHouseholdId(data?.household_id || null)
        setHouseholdLoading(false)
      })
      .catch(() => setHouseholdLoading(false))
  }, [session?.user?.id])

  const handleLogout = async () => {
    await sb.auth.signOut()
    setHouseholdId(null)
  }

  if (loadingSession) return <SplashLoader/>
  if (!session) return <AuthScreen/>
  if (householdLoading) return <SplashLoader label="Carregando conta..."/>
  if (!householdId) return <HouseholdSetupScreen session={session} onReady={setHouseholdId} onLogout={handleLogout}/>
  return <MainApp session={session} householdId={householdId} onLogout={handleLogout}/>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)

    navigator.serviceWorker.register('./sw.js').catch(()=>{})
  })
